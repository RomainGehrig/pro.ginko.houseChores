<div id="app">
  <section id="view-today" class="view">
    <h1 class="route-heading" tabindex="-1">Today</h1>
    <div class="time-options">
      <button class="time-btn" data-minutes="5"><span class="fig">5</span> min</button>
      <button class="time-btn" data-minutes="15"><span class="fig">15</span> min</button>
      <button class="time-btn" data-minutes="30"><span class="fig">30</span> min</button>
      <label>Custom: <input id="customMinutes" type="number" min="1" placeholder="minutes"></label>
    </div>
    <div class="category-filter">
      <label>Category filter:
        <select id="categoryFilter">
          <option value="">All</option>
        </select>
      </label>
    </div>
    <button id="proposeBundleBtn">Propose Bundle</button>
    <div id="sessionStatus" role="status"></div>
    <div id="bundlePreview"></div>
    <button id="startSessionBtn" style="display:none">Start Doing</button>
  </section>

  <section id="view-inbox" class="view" style="display:none">
    <h1 class="route-heading" tabindex="-1">Inbox</h1>
    <div class="add-task-box">
      <h2>Add Tasks</h2>
      <textarea id="newTaskInput" placeholder="One task per line, e.g.&#10;Clean bathroom&#10;Pay electricity bill"></textarea>
      <button id="addTasksBtn">Add</button>
      <button id="enrichBtn">Enrich with AI</button>
      <span id="enrichStatus"></span>
    </div>
    <div class="task-section">
      <h2>Needs Review</h2>
      <div class="task-cards" id="proposedCards"></div>
    </div>
  </section>

  <section id="view-chores" class="view" style="display:none">
    <h1 class="route-heading" tabindex="-1">Chores</h1>
    <div id="choresStatus" role="status"></div>
    <div class="task-section">
      <div class="task-cards" id="activeCards"></div>
    </div>
    <nav class="route-leaf-nav" aria-label="Chore options">
      <a id="archiveNav" href="#/archive">Archived · <span id="archiveNavCount" class="fig">0</span></a>
      <a href="#/setup">Setup · categories and locations</a>
    </nav>
  </section>

  <section id="view-archive" class="view" style="display:none">
    <h1 class="route-heading" tabindex="-1">Archive</h1>
    <a class="back-link" href="#/chores">‹ CHORES</a>
    <div id="archiveStatus" role="status"></div>
    <div class="task-section">
      <div class="task-cards" id="archivedCards"></div>
    </div>
  </section>

  <section id="view-setup" class="view" style="display:none">
    <h1 class="route-heading" tabindex="-1">Setup</h1>
    <a class="back-link" href="#/chores">‹ CHORES</a>
    <details id="referenceManager" class="reference-manager">
      <summary>Categories &amp; locations</summary>
      <div id="referenceManagerStatus" class="inline-status" role="status"></div>
      <div class="reference-columns">
        <section aria-labelledby="categoriesHeading">
          <h3 id="categoriesHeading">Categories</h3>
          <form id="addCategoryForm" class="reference-add-form">
            <input id="newCategoryName" aria-label="New category name" autocomplete="off">
            <button type="submit">Add</button>
          </form>
          <div id="categoryManagerList"></div>
        </section>
        <section aria-labelledby="locationsHeading">
          <h3 id="locationsHeading">Locations</h3>
          <form id="addLocationForm" class="reference-add-form">
            <input id="newLocationName" aria-label="New location name" autocomplete="off">
            <button type="submit">Add</button>
          </form>
          <div id="locationManagerList"></div>
        </section>
      </div>
    </details>
  </section>

  <section id="view-doing" class="view" style="display:none" aria-label="Active chore session">
    <h1 class="route-heading" tabindex="-1">Doing</h1>
    <div id="doingContent" class="doing-session"></div>
  </section>

  <section id="view-review" class="view" style="display:none">
    <h1 class="route-heading" tabindex="-1">Session Review</h1>
    <div id="reviewList"></div>
    <div id="durationOffers"></div>
    <button id="finishReviewBtn">Finish</button>
  </section>

  <section id="view-log" class="view" style="display:none">
    <h1 class="route-heading" tabindex="-1">Session History</h1>
    <div id="historyList"></div>
  </section>
</div>

<div id="sheetScrim" hidden></div>
<section id="bottomSheet" hidden role="dialog" aria-modal="true" aria-labelledby="bottomSheetTitle">
  <h2 id="bottomSheetTitle"></h2>
  <p id="bottomSheetMessage"></p>
  <div id="bottomSheetActions"></div>
</section>

<div id="undoToast" hidden role="status" aria-live="polite">
  <span id="undoToastMessage"></span>
  <span class="undo-separator">&middot;</span>
  <button id="undoToastButton" type="button">Undo</button>
</div>

<nav class="bottom-nav" aria-label="Primary">
  <a data-route="today" href="#/today">TODAY</a>
  <a id="inboxNav" data-route="inbox" href="#/inbox" hidden aria-label="Inbox, 0 to confirm">INBOX <span class="nav-count fig">0</span></a>
  <a data-route="chores" href="#/chores">CHORES</a>
  <a data-route="log" href="#/log">LOG</a>
</nav>
