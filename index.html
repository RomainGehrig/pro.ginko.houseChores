<div id="app">
  <header class="app-header">
    <h1>Chore Planner</h1>
    <nav class="view-nav">
      <a class="nav-btn" data-view="tasks" href="#/chores">Tasks</a>
      <a class="nav-btn" data-view="session" href="#/today">Start Session</a>
      <a class="nav-btn" data-view="history" href="#/log">History</a>
      <a class="nav-btn" data-view="doing" href="#/doing" style="display:none">Doing</a>
      <a class="nav-btn" data-view="review" href="#/receipt/session" style="display:none">Review</a>
    </nav>
  </header>

  <section id="view-tasks" class="view">
    <h2 class="route-heading" tabindex="-1">Chores</h2>
    <details id="referenceManager" class="reference-manager">
      <summary>Categories &amp; locations</summary>
      <div id="referenceManagerStatus" class="inline-status" role="status"></div>
      <div class="reference-columns">
        <section aria-labelledby="categoriesHeading">
          <h3 id="categoriesHeading">Categories</h3>
          <form id="addCategoryForm" class="reference-add-form">
            <input id="newCategoryName" aria-label="New category name" autocomplete="off">
            <button type="submit">Add</button>
          </form>
          <div id="categoryManagerList"></div>
        </section>
        <section aria-labelledby="locationsHeading">
          <h3 id="locationsHeading">Locations</h3>
          <form id="addLocationForm" class="reference-add-form">
            <input id="newLocationName" aria-label="New location name" autocomplete="off">
            <button type="submit">Add</button>
          </form>
          <div id="locationManagerList"></div>
        </section>
      </div>
    </details>

    <div class="add-task-box">
      <h2>Add Tasks</h2>
      <textarea id="newTaskInput" placeholder="One task per line, e.g.&#10;Clean bathroom&#10;Pay electricity bill"></textarea>
      <button id="addTasksBtn">Add</button>
      <button id="enrichBtn">Enrich with AI</button>
      <span id="enrichStatus"></span>
    </div>

    <div class="task-section">
      <h2>Needs Review</h2>
      <div class="task-cards" id="proposedCards"></div>
    </div>

    <div class="task-section">
      <h2>Active Tasks</h2>
      <div class="task-cards" id="activeCards"></div>
    </div>

    <div class="task-section">
      <h2>Archived</h2>
      <div class="task-cards" id="archivedCards"></div>
    </div>
  </section>

  <section id="view-session" class="view" style="display:none">
    <h2 class="route-heading" tabindex="-1">Start a Session</h2>
    <div class="time-options">
      <button class="time-btn" data-minutes="5"><span class="fig">5</span> min</button>
      <button class="time-btn" data-minutes="15"><span class="fig">15</span> min</button>
      <button class="time-btn" data-minutes="30"><span class="fig">30</span> min</button>
      <label>Custom: <input id="customMinutes" type="number" min="1" placeholder="minutes"></label>
    </div>
    <div class="category-filter">
      <label>Category filter:
        <select id="categoryFilter">
          <option value="">All</option>
        </select>
      </label>
    </div>
    <button id="proposeBundleBtn">Propose Bundle</button>

    <div id="bundlePreview"></div>
    <button id="startSessionBtn" style="display:none">Start Doing</button>
  </section>

  <section id="view-doing" class="view" style="display:none" aria-label="Active chore session">
    <h2 class="route-heading" tabindex="-1">Doing</h2>
    <div id="doingContent" class="doing-session"></div>
  </section>

  <section id="view-review" class="view" style="display:none">
    <h2 class="route-heading" tabindex="-1">Session Review</h2>
    <div id="reviewList"></div>
    <button id="finishReviewBtn">Finish</button>
  </section>

  <section id="view-history" class="view" style="display:none">
    <h2 class="route-heading" tabindex="-1">Session History</h2>
    <div id="historyList"></div>
  </section>
</div>
